<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Perfil — New[Way]</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css"
    />
    <link rel="stylesheet" href="css/perfil.css" />
  </head>
  <body>
    <!--NAVBAR  -->
    <header class="header">
      <nav class="navbar">
        <a href="dashboard.html">DASHBOARD</a>
        <a href="pacotes.html">PACOTES</a>
        <a href="#" class="active">PERFIL</a>
        <a href="login.html">SAIR</a>
        <a href="index.html" class="navbar-logo"
          ><img
            src="assets/imgs/logoNeway.png"
            alt="New Way"
            height="32"
            style="display: block"
        /></a>
      </nav>
    </header>

    <main class="page">
      <!-- Profile header card -->
      <div class="profile-card" id="profileCard">
        <div class="avatar-wrap">
          <div class="avatar" id="avatarEl" title="Alterar foto"></div>
          <div class="avatar-badge"></div>
        </div>
        <div class="profile-info">
          <div class="profile-name" id="displayName"></div>
          <div class="profile-email" id="displayEmail"></div>
          <div class="profile-meta">
            <div class="meta-item">
              <i class="ph ph-calendar-blank"></i>
              <span id="displayBirth"></span>
            </div>
            <div class="meta-item">
              <i class="ph ph-map-pin"></i>
              <span id="displayCity"></span>
            </div>
          </div>
        </div>
      </div>

      <div class="form-card">
        <div class="form-card-title">
          Editar meu perfil
          <span class="changed-badge" id="changedBadge">
            <i class="ph ph-clock"></i>
            Alterações pendentes
          </span>
        </div>

        <div class="form-grid">
          <div class="form-group">
            <label class="form-label" for="nome">Nome completo</label>
            <input class="form-input" id="nome" type="text" />
          </div>

          <div class="form-group">
            <label class="form-label" for="email">E-mail</label>
            <input class="form-input" id="email" type="email" />
          </div>

          <div class="form-group">
            <label class="form-label" for="nascimento"
              >Data de nascimento</label
            >
            <input class="form-input" id="nascimento" type="date" />
          </div>

          <div class="form-group">
            <label class="form-label" for="telefone">Telefone</label>
            <input
              class="form-input"
              id="telefone"
              type="tel"
              placeholder="(11) 99999-9999"
            />
          </div>
          <div class="form-group">
            <label class="form-label" for="cep">CEP</label>
            <input
              class="form-input"
              id="cep"
              type="text"
              placeholder="00000-000"
            />
          </div>

          <div class="form-group">
            <label class="form-label" for="longradouro">Logradouro</label>
            <input class="form-input" id="longradouro" type="text" />
          </div>

          <div class="form-group">
            <label class="form-label" for="numero">Número</label>
            <input
              class="form-input"
              id="numero"
              type="text"
              placeholder="Ex: 123"
            />
          </div>

          <div class="form-group">
            <label class="form-label" for="complemento">Complemento</label>
            <input
              class="form-input"
              id="complemento"
              type="text"
              placeholder="Apto, Bloco, Casa..."
            />
          </div>

          <div class="form-group">
            <label class="form-label" for="bairro">Bairro</label>
            <input class="form-input" id="bairro" type="text" />
          </div>

          <div class="form-group">
            <label class="form-label" for="cidade">Cidade</label>
            <input
              class="form-input"
              id="cidade"
              type="text"
              value="São Paulo"
            />
          </div>

          <div class="form-group full">
            <label class="form-label" for="estado">Estado</label>
            <select class="form-input" id="estado">
              <option value="">Selecione...</option>
              <option value="AC">Acre</option>
              <option value="AL">Alagoas</option>
              <option value="AP">Amapá</option>
              <option value="AM">Amazonas</option>
              <option value="BA">Bahia</option>
              <option value="CE">Ceará</option>
              <option value="DF">Distrito Federal</option>
              <option value="ES">Espírito Santo</option>
              <option value="GO">Goiás</option>
              <option value="MA">Maranhão</option>
              <option value="MT">Mato Grosso</option>
              <option value="MS">Mato Grosso do Sul</option>
              <option value="MG">Minas Gerais</option>
              <option value="PA">Pará</option>
              <option value="PB">Paraíba</option>
              <option value="PR">Paraná</option>
              <option value="PE">Pernambuco</option>
              <option value="PI">Piauí</option>
              <option value="RJ">Rio de Janeiro</option>
              <option value="RN">Rio Grande do Norte</option>
              <option value="RS">Rio Grande do Sul</option>
              <option value="RO">Rondônia</option>
              <option value="RR">Roraima</option>
              <option value="SC">Santa Catarina</option>
              <option value="SP" selected>São Paulo</option>
              <option value="SE">Sergipe</option>
              <option value="TO">Tocantins</option>
            </select>
          </div>
        </div>

        <div class="form-actions">
          <button class="btn-save" id="btnSave" onclick="saveProfile()">
            <i class="ph ph-floppy-disk"></i>
            Salvar alterações
          </button>
          <button class="btn-cancel" onclick="cancelEdit()">Cancelar</button>
        </div>
      </div>
    </main>

    <div class="toast" id="toast">
      <span class="toast-icon"><i class="ph ph-check-circle"></i></span>
      <span id="toastMsg">Perfil atualizado com sucesso!</span>
    </div>

    <script src="js/perfil.js"></script>
  </body>
</html>

<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Perfil — New[Way]</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css"
    />
    <link rel="stylesheet" href="css/perfil.css" />
  </head>
  <body>
    <header class="topbar">
      <nav class="topbar-nav">
        <div class="nav-pill">
          <div class="nav-logo-slot">logo</div>
          <button class="nav-btn">Dashboard</button>
          <button class="nav-btn">Pacotes</button>
          <button class="nav-btn active">Perfil</button>
        </div>
      </nav>
    </header>

    <main class="page">
      <!-- Profile header card -->
      <div class="profile-card" id="profileCard">
        <div class="avatar-wrap">
          <div class="avatar" id="avatarEl" title="Alterar foto">P</div>
          <div class="avatar-badge"></div>
        </div>
        <div class="profile-info">
          <div class="profile-name" id="displayName"></div>
          <div class="profile-email" id="displayEmail"></div>
          <div class="profile-meta">
            <div class="meta-item">
              <i class="ph ph-calendar-blank"></i>
              <span id="displayBirth"></span>
            </div>
            <div class="meta-item">
              <i class="ph ph-map-pin"></i>
              <span id="displayCity"></span>
            </div>
            <div class="meta-item">
              <i class="ph ph-shield-check"></i>
              <span>Membro ativo</span>
            </div>
          </div>
        </div>
      </div>

      <div class="form-card">
        <div class="form-card-title">
          Editar meu perfil
          <span class="changed-badge" id="changedBadge">
            <i class="ph ph-clock"></i>
            Alterações pendentes
          </span>
        </div>

        <div class="form-grid">
          <div class="form-group">
            <label class="form-label" for="nome">Nome completo</label>
            <input class="form-input" id="nome" type="text" />
          </div>

          <div class="form-group">
            <label class="form-label" for="email">E-mail</label>
            <input class="form-input" id="email" type="email" />
          </div>

          <div class="form-group">
            <label class="form-label" for="nascimento"
              >Data de nascimento</label
            >
            <input class="form-input" id="nascimento" type="date" />
          </div>

          <div class="form-group">
            <label class="form-label" for="telefone">Telefone</label>
            <input
              class="form-input"
              id="telefone"
              type="tel"
              placeholder="(11) 99999-9999"
            />
          </div>

          <div class="form-group">
            <label class="form-label" for="endereco">Endereço</label>
            <input class="form-input" id="endereco" type="text" />
          </div>

          <div class="form-group">
            <label class="form-label" for="cep">CEP</label>
            <input
              class="form-input"
              id="cep"
              type="text"
              placeholder="00000-000"
            />
          </div>

          <div class="form-group full">
            <label class="form-label" for="cidade">Cidade</label>
            <input
              class="form-input"
              id="cidade"
              type="text"
              value="São Paulo"
            />
          </div>
        </div>

        <div class="form-actions">
          <button class="btn-save" id="btnSave" onclick="saveProfile()">
            <i class="ph ph-floppy-disk"></i>
            Salvar alterações
          </button>
          <button class="btn-cancel" onclick="cancelEdit()">Cancelar</button>
        </div>
      </div>
    </main>

    <div class="toast" id="toast">
      <span class="toast-icon"><i class="ph ph-check-circle"></i></span>
      <span id="toastMsg">Perfil atualizado com sucesso!</span>
    </div>

    <script src="js/perfil.js"></script>
  </body>
</html>

<section class="pacotes">

    <div class="pacotesTitulo">
        <h1>Gestão de <b>Eventos Culturais</b></h1>
    </div>

    <div class="conteudoPacotes">

        <div class="listaPacotes">

            <div *ngFor="let evento of listaEventos" class="cardPacote" style="min-height: auto; padding: 22px; margin-bottom: 15px; align-items: center;">
                
                <div class="infoPacote" style="flex: 2;">
                    <h3>{{ evento.nome }}</h3>
                    <span class="categoria" style="background-color: #2c3e50; color: #fff; padding: 4px 10px; border-radius: 4px; font-size: 11px;">
                         {{ evento.localidade }}
                    </span>
                </div>

                <div class="dadosPacote" style="flex: 1; justify-content: center;">
                    <span style="font-weight: 700; color: #bfa15f; font-family: 'Syne', sans-serif;">
                        {{ evento.data | date:'dd/MM/yyyy' }}
                    </span>
                </div>

                <div class="acoesPacote" style="display: flex; gap: 12px; font-size: 18px;">
                    <button (click)="prepararEdicao(evento)" title="Editar" style="background: none; border: none; cursor: pointer; color: #3498db; transition: 0.2s;">✎</button>
                    <button (click)="deletarEvento(evento.id)" title="Excluir" style="background: none; border: none; cursor: pointer; color: #e74c3c; transition: 0.2s;">✕</button>
                </div>
            </div>

            <div *ngIf="listaEventos.length === 0" style="text-align: center; padding: 40px; color: #888; font-family: 'DM Sans';">
                Nenhum evento agendado para 2026.
            </div>

        </div>

        <div class="formPacote">

            <h2>{{ modoEdicao ? 'Editar' : 'Criar Novo' }} <b>Evento</b></h2>

            <div class="inputs" style="margin-top: 25px;">
                
                <div style="display: flex; flex-direction: column; gap: 6px; margin-bottom: 15px;">
                    <label style="font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500; color: #555;">Nome do Evento</label>
                    <input type="text" name="nome" [(ngModel)]="eventoForm.nome" placeholder="Ex: Carnaval de Salvador">
                </div>

                <div style="display: flex; flex-direction: column; gap: 6px; margin-bottom: 15px;">
                    <label style="font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500; color: #555;">Localidade</label>
                    <input type="text" name="localidade" [(ngModel)]="eventoForm.localidade" placeholder="Ex: Salvador, BA">
                </div>

                <div style="display: flex; flex-direction: column; gap: 6px; margin-bottom: 25px;">
                    <label style="font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500; color: #555;">Data do Evento</label>
                    <input type="date" name="data" [(ngModel)]="eventoForm.data" placeholder="DD/MM/AAAA">
                </div>

                <div style="display: flex; gap: 10px;">
                    <button class="btnPublicar" (click)="salvarEvento()" style="flex: 2; cursor: pointer;">
                        {{ modoEdicao ? 'Salvar Alterações' : 'Publicar Evento' }}
                    </button>
                    
                    <button *ngIf="modoEdicao" (click)="cancelarEdicao()" 
                            style="flex: 1; background-color: #e74c3c; color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-family: 'Syne', sans-serif; font-weight: bold; font-size: 13px;">
                        Cancelar
                    </button>
                </div>

            </div>

        </div>

    </div>
</section>
